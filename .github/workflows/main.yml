name: Smart Money Radar Execution

on:
  schedule:
    # Esegue ogni lunedì alle 02:00 UTC (dopo le chiusure e il consolidamento del fine settimana)
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il codice della repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}

    - name: Configura ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa dipendenze necessarie
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance requests openpyxl numpy

    # 1. Scansione automatica del Consulente Smart Money Globale
    - name: Esegui Consulente Smart Money
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CANALE_ACCUMULAZIONE_ID: ${{ secrets.CANALE_ACCUMULAZIONE_ID }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: python main.py

    # 2. Scansione del tuo Portafoglio Personale
    - name: Esegui Monitor Portafoglio Personale
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CANALE_ACCUMULAZIONE_ID: ${{ secrets.CANALE_ACCUMULAZIONE_ID }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: python portafoglio_personale.py

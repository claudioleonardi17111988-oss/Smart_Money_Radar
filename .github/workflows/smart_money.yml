name: Smart Money Quotidiano

on:
  schedule:
    # Esegue ogni giorno alle 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-smart-money:
    runs-on: ubuntu-latest
    steps:
    - name: Scarica il codice della repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
    - name: Configura ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Installa dipendenze necessarie
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance requests openpyxl numpy
    - name: Esegui Consulente Smart Money
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CANALE_ACCUMULAZIONE_ID: ${{ secrets.CANALE_ACCUMULAZIONE_ID }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: python main.py
